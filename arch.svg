<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="156.6mm" viewBox="0 0 2200 1160" role="img" aria-labelledby="title desc">
  <title id="title">현재 Arch 모듈 구조</title>
  <desc id="desc">arch.py의 명령·결과 경로, CDB 되먹임, 제어 경로를 나타낸 벡터 도식. ISSUE, 세 산술 EX 그룹, memory_access와 mem_ctrl, 단일 WB, COMMIT, ARF/RAT/PRF, 고정 순환 ROB, 분기 복구를 포함한다. 숫자는 default_config.json의 기본 설정이다. 제어 호출 순서는 데이터 흐름 순서와 다르다.</desc>
  <rect x="10" y="10" width="2180" height="1140" rx="22" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <g font-family="Arial" fill="#000000" text-anchor="middle">
    <text text-anchor="middle" font-family="Arial" x="1100" y="68" font-size="44" font-weight="700">현재 Arch 모듈 구조</text>

    <!-- Arch boundary and cycle control. -->
    <rect x="300" y="105" width="1870" height="975" rx="22" fill="#ccecff" stroke="#000000" stroke-width="4"/>
    <text text-anchor="middle" font-family="Arial" x="1235" y="150" font-size="29" font-weight="700">Arch</text>
    <rect x="340" y="175" width="1790" height="58" rx="10" fill="#fff2cc" stroke="#000000" stroke-width="3"/>
    <text text-anchor="middle" font-family="Arial" x="1235" y="214" font-size="28" font-weight="700">module(rising_edge)</text>
    <text text-anchor="middle" font-family="Arial" x="520" y="212" font-size="21">recover() / CDB</text>
    <text text-anchor="middle" font-family="Arial" x="1930" y="212" font-size="21">pc / dyn / pred / squashed</text>

    <!-- Control arrows: actual call order is numbered right to left. -->
    <g fill="#ff0000" stroke="#ff0000" stroke-width="3">
      <path d="M 470,233 V 276" fill="none"/>
      <path d="M 470,283 L 462,269 L 478,269 Z"/>
      <path d="M 832,233 V 276" fill="none"/>
      <path d="M 832,283 L 824,269 L 840,269 Z"/>
      <path d="M 1290,233 V 276" fill="none"/>
      <path d="M 1290,283 L 1282,269 L 1298,269 Z"/>
      <path d="M 1675,233 V 276" fill="none"/>
      <path d="M 1675,283 L 1667,269 L 1683,269 Z"/>
      <path d="M 1985,233 V 276" fill="none"/>
      <path d="M 1985,283 L 1977,269 L 1993,269 Z"/>
    </g>
    <g font-size="19" fill="#c00000" font-weight="700">
      <text text-anchor="middle" font-family="Arial" x="489" y="262">5</text>
      <text text-anchor="middle" font-family="Arial" x="851" y="262">4</text>
      <text text-anchor="middle" font-family="Arial" x="1309" y="262">3</text>
      <text text-anchor="middle" font-family="Arial" x="1694" y="262">2</text>
      <text text-anchor="middle" font-family="Arial" x="2004" y="262">1</text>
    </g>

    <!-- Existing Testbench interface. -->
    <rect x="35" y="285" width="225" height="280" fill="#ccecff" stroke="#000000" stroke-width="4"/>
    <text text-anchor="middle" font-family="Arial" x="147" y="340" font-size="29" font-weight="700">Testbench</text>
    <text text-anchor="middle" font-family="Arial" x="147" y="402" font-size="27">inst</text>
    <text text-anchor="middle" font-family="Arial" x="147" y="449" font-size="27">config</text>
    <text text-anchor="middle" font-family="Arial" x="147" y="516" font-size="22">rising_edge</text>
    <rect x="35" y="840" width="225" height="195" fill="#ccecff" stroke="#000000" stroke-width="4"/>
    <text text-anchor="middle" font-family="Arial" x="147" y="884" font-size="26" font-weight="700">초기 상태</text>
    <text text-anchor="middle" font-family="Arial" x="147" y="931" font-size="24">arf_r / arf_f</text>
    <text text-anchor="middle" font-family="Arial" x="147" y="980" font-size="24">mem</text>

    <!-- Five logical stage groups. -->
    <g fill="#fff2cc" stroke="#000000" stroke-width="4">
      <rect x="340" y="285" width="260" height="405" rx="8"/>
      <rect x="650" y="285" width="365" height="405" rx="8"/>
      <rect x="1070" y="285" width="440" height="405" rx="8"/>
      <rect x="1565" y="285" width="220" height="405" rx="8"/>
      <rect x="1840" y="285" width="290" height="405" rx="8"/>
    </g>
    <g font-size="31" font-weight="700">
      <text text-anchor="middle" font-family="Arial" x="470" y="329">ISSUE</text>
      <text text-anchor="middle" font-family="Arial" x="832" y="329">EX</text>
      <text text-anchor="middle" font-family="Arial" x="1290" y="329">MEM</text>
      <text text-anchor="middle" font-family="Arial" x="1675" y="329">WB</text>
      <text text-anchor="middle" font-family="Arial" x="1985" y="329">COMMIT</text>
    </g>
    <g font-size="24">
      <text text-anchor="middle" font-family="Arial" x="470" y="366">issue()</text>
      <text text-anchor="middle" font-family="Arial" x="832" y="366">execute() / tomasulo()</text>
      <text text-anchor="middle" font-family="Arial" x="1290" y="366">memory_access()</text>
      <text text-anchor="middle" font-family="Arial" x="1675" y="366">write_back()</text>
      <text text-anchor="middle" font-family="Arial" x="1985" y="366">commit()</text>
    </g>

    <!-- ISSUE reads and allocates existing resources. -->
    <g fill="#e8ffd9" stroke="#000000" stroke-width="3">
      <rect x="359" y="398" width="222" height="115"/>
      <rect x="359" y="542" width="222" height="112"/>
    </g>
    <text text-anchor="middle" font-family="Arial" x="470" y="436" font-size="26" font-weight="700">RS / PRF</text>
    <text text-anchor="middle" font-family="Arial" x="470" y="472" font-size="22">ARF / RAT / PRF</text>
    <text text-anchor="middle" font-family="Arial" x="470" y="578" font-size="25" font-weight="700">RAT / ROB</text>
    <text text-anchor="middle" font-family="Arial" x="470" y="615" font-size="21">rename / alloc.</text>

    <!-- Arithmetic RS groups, separate from LD/ST. -->
    <g fill="#e8ffd9" stroke="#000000" stroke-width="3">
      <rect x="670" y="391" width="325" height="84"/>
      <rect x="670" y="487" width="325" height="84"/>
      <rect x="670" y="583" width="325" height="84"/>
    </g>
    <g font-size="25" font-weight="700">
      <text text-anchor="middle" font-family="Arial" x="832" y="420">Integer</text>
      <text text-anchor="middle" font-family="Arial" x="832" y="516">FP ADD / SUB</text>
      <text text-anchor="middle" font-family="Arial" x="832" y="612">FP MUL</text>
    </g>
    <g font-size="21">
      <text text-anchor="middle" font-family="Arial" x="832" y="450">2 RS / EX=1 / busy</text>
      <text text-anchor="middle" font-family="Arial" x="832" y="546">3 RS / EX=3</text>
      <text text-anchor="middle" font-family="Arial" x="832" y="642">2 RS / EX=20</text>
    </g>
    <text text-anchor="middle" font-family="Arial" x="832" y="681" font-size="17">tm_rs / tm_count / tm_ret</text>

    <!-- MEM arbitration owns the LD/ST controller call, not its work. -->
    <rect x="1090" y="398" width="400" height="68" fill="#e8ffd9" stroke="#000000" stroke-width="3"/>
    <text text-anchor="middle" font-family="Arial" x="1290" y="441" font-size="25" font-weight="700">age 중재 / mem_inst</text>
    <rect x="1090" y="489" width="400" height="179" fill="#e8ffd9" stroke="#000000" stroke-width="3"/>
    <text text-anchor="middle" font-family="Arial" x="1290" y="525" font-size="27" font-weight="700">mem_ctrl()</text>
    <text text-anchor="middle" font-family="Arial" x="1290" y="562" font-size="23">mem_rs (3) / forwarding</text>
    <text text-anchor="middle" font-family="Arial" x="1290" y="603" font-size="23">주소 EX=1 → LD/ST=4</text>
    <text text-anchor="middle" font-family="Arial" x="1290" y="642" font-size="22">mem_ex_idx / mem_idx</text>
    <g stroke="#ff0000" stroke-width="3" fill="#ff0000">
      <path d="M 1290,466 V 479" fill="none"/>
      <path d="M 1290,488 L 1282,475 H 1298 Z"/>
    </g>

    <!-- Single WB value and in-order commit. -->
    <g fill="#e8ffd9" stroke="#000000" stroke-width="3">
      <rect x="1582" y="398" width="186" height="115"/>
      <rect x="1582" y="542" width="186" height="112"/>
      <rect x="1860" y="398" width="250" height="115"/>
      <rect x="1860" y="542" width="250" height="112"/>
    </g>
    <text text-anchor="middle" font-family="Arial" x="1675" y="437" font-size="25" font-weight="700">wb_value</text>
    <text text-anchor="middle" font-family="Arial" x="1675" y="475" font-size="22">PRF write</text>
    <text text-anchor="middle" font-family="Arial" x="1675" y="580" font-size="25" font-weight="700">ROB ready</text>
    <text text-anchor="middle" font-family="Arial" x="1675" y="617" font-size="22">wb_inst (1)</text>
    <text text-anchor="middle" font-family="Arial" x="1985" y="437" font-size="25" font-weight="700">ROB head</text>
    <text text-anchor="middle" font-family="Arial" x="1985" y="475" font-size="23">PRF → ARF</text>
    <text text-anchor="middle" font-family="Arial" x="1985" y="580" font-size="25" font-weight="700">SD: strt=True</text>
    <text text-anchor="middle" font-family="Arial" x="1985" y="617" font-size="23">ROB 반환</text>

    <!-- Main instruction/result arrows. -->
    <g fill="#0000ff" stroke="#000000" stroke-width="3">
      <path d="M 260,454 H 312 V 442 L 340,470 L 312,498 V 486 H 260 Z"/>
      <path d="M 600,454 H 623 V 442 L 650,470 L 623,498 V 486 H 600 Z"/>
      <path d="M 1015,454 H 1042 V 442 L 1070,470 L 1042,498 V 486 H 1015 Z"/>
      <path d="M 1510,454 H 1537 V 442 L 1565,470 L 1537,498 V 486 H 1510 Z"/>
      <path d="M 260,922 H 280 V 910 L 300,938 L 280,966 V 954 H 260 Z"/>
    </g>

    <!-- LD/ST allocation bypasses the arithmetic EX groups. -->
    <path d="M 600,625 H 625 V 716 H 1045 V 635 H 1079" fill="none" stroke="#000000" stroke-width="17" stroke-linejoin="round"/>
    <path d="M 600,625 H 625 V 716 H 1045 V 635 H 1079" fill="none" stroke="#0000ff" stroke-width="11" stroke-linejoin="round"/>
    <path d="M 1090,635 L 1071,620 V 650 Z" fill="#0000ff" stroke="#000000" stroke-width="2"/>
    <rect x="773" y="704" width="125" height="27" fill="#ccecff"/>
    <text text-anchor="middle" font-family="Arial" x="835" y="726" font-size="20" font-weight="700">LD / ST</text>

    <!-- Prior WB value broadcasts once, to both RS families. -->
    <path d="M 1730,690 V 755 H 832 V 711" fill="none" stroke="#000000" stroke-width="14" stroke-linejoin="round"/>
    <path d="M 1730,690 V 755 H 832 V 711" fill="none" stroke="#b7dde8" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 832,690 L 818,713 H 846 Z" fill="#b7dde8" stroke="#000000" stroke-width="2"/>
    <path d="M 1260,755 V 711" fill="none" stroke="#000000" stroke-width="14"/>
    <path d="M 1260,755 V 711" fill="none" stroke="#b7dde8" stroke-width="9"/>
    <path d="M 1260,690 L 1246,713 H 1274 Z" fill="#b7dde8" stroke="#000000" stroke-width="2"/>
    <text text-anchor="middle" font-family="Arial" x="1080" y="793" font-size="24" font-weight="700">CDB: wb_value · 다음 사이클</text>

    <!-- Shared state: committed/register alias state. -->
    <rect x="340" y="860" width="550" height="175" fill="#e8ffd9" stroke="#000000" stroke-width="3"/>
    <path d="M 615,860 V 1035" stroke="#000000" stroke-width="2"/>
    <text text-anchor="middle" font-family="Arial" x="477" y="902" font-size="28" font-weight="700">ARF</text>
    <text text-anchor="middle" font-family="Arial" x="752" y="902" font-size="28" font-weight="700">RAT</text>
    <text text-anchor="middle" font-family="Arial" x="477" y="948" font-size="24">arf_r[32]</text>
    <text text-anchor="middle" font-family="Arial" x="477" y="990" font-size="24">arf_f[32]</text>
    <text text-anchor="middle" font-family="Arial" x="752" y="948" font-size="24">rat_r[32]</text>
    <text text-anchor="middle" font-family="Arial" x="752" y="990" font-size="24">rat_f[32]</text>
    <path d="M 470,860 V 712" fill="none" stroke="#000000" stroke-width="17"/>
    <path d="M 470,860 V 712" fill="none" stroke="#0000ff" stroke-width="11"/>
    <path d="M 470,690 L 453,717 H 487 Z" fill="#0000ff" stroke="#000000" stroke-width="2"/>
    <path d="M 752,860 V 823 H 550 V 712" fill="none" stroke="#000000" stroke-width="14" stroke-linejoin="round"/>
    <path d="M 752,860 V 823 H 550 V 712" fill="none" stroke="#b7dde8" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 550,690 L 536,713 H 564 Z" fill="#b7dde8" stroke="#000000" stroke-width="2"/>

    <!-- Predictor/recovery state. -->
    <rect x="940" y="860" width="270" height="175" fill="#e8ffd9" stroke="#000000" stroke-width="3"/>
    <text text-anchor="middle" font-family="Arial" x="1075" y="902" font-size="26" font-weight="700">BHT / BTB (8)</text>
    <text text-anchor="middle" font-family="Arial" x="1075" y="948" font-size="23">resolve_branch()</text>
    <text text-anchor="middle" font-family="Arial" x="1075" y="990" font-size="23">recover()</text>
    <path d="M 970,690 V 820 H 1075 V 850" fill="none" stroke="#ff0000" stroke-width="3"/>
    <path d="M 1075,860 L 1067,846 H 1083 Z" fill="#ff0000"/>
    <path d="M 940,978 H 910 V 841 H 325 V 204 H 340" fill="none" stroke="#ff0000" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 347,204 L 333,196 V 212 Z" fill="#ff0000"/>

    <!-- Single memory port, physical register file and fixed ROB. -->
    <g fill="#e8ffd9" stroke="#000000" stroke-width="3">
      <rect x="1240" y="860" width="270" height="175"/>
      <rect x="1565" y="860" width="220" height="175"/>
      <rect x="1840" y="860" width="290" height="175"/>
    </g>
    <text text-anchor="middle" font-family="Arial" x="1375" y="906" font-size="29" font-weight="700">mem[64]</text>
    <text text-anchor="middle" font-family="Arial" x="1375" y="950" font-size="24">256 B / 1 port</text>
    <text text-anchor="middle" font-family="Arial" x="1375" y="992" font-size="23">LD / SD</text>
    <text text-anchor="middle" font-family="Arial" x="1675" y="902" font-size="28" font-weight="700">PRF</text>
    <text text-anchor="middle" font-family="Arial" x="1675" y="948" font-size="23">prf_r[256]</text>
    <text text-anchor="middle" font-family="Arial" x="1675" y="990" font-size="23">prf_f[256]</text>
    <text text-anchor="middle" font-family="Arial" x="1985" y="902" font-size="28" font-weight="700">ROB (128)</text>
    <text text-anchor="middle" font-family="Arial" x="1985" y="943" font-size="21">valid / dst / inst</text>
    <text text-anchor="middle" font-family="Arial" x="1985" y="977" font-size="21">rob_head / rob_tail</text>
    <g fill="#ccecff" stroke="#000000" stroke-width="2">
      <rect x="1870" y="995" width="42" height="22"/>
      <rect x="1917" y="995" width="42" height="22"/>
      <rect x="1964" y="995" width="42" height="22"/>
      <rect x="2011" y="995" width="42" height="22" fill="#ffffff"/>
      <rect x="2058" y="995" width="42" height="22" fill="#ffffff"/>
    </g>

    <!-- Memory data path and WB -> PRF. White bridges denote no connection. -->
    <path d="M 1375,860 V 690" fill="none" stroke="#ffffff" stroke-width="23"/>
    <path d="M 1375,860 V 690" fill="none" stroke="#000000" stroke-width="17"/>
    <path d="M 1375,860 V 690" fill="none" stroke="#0000ff" stroke-width="11"/>
    <path d="M 1375,674 L 1358,701 H 1392 Z" fill="#0000ff" stroke="#000000" stroke-width="2"/>
    <path d="M 1375,860 L 1358,833 H 1392 Z" fill="#0000ff" stroke="#000000" stroke-width="2"/>
    <path d="M 1630,690 V 839" fill="none" stroke="#ffffff" stroke-width="23"/>
    <path d="M 1630,690 V 839" fill="none" stroke="#000000" stroke-width="17"/>
    <path d="M 1630,690 V 839" fill="none" stroke="#0000ff" stroke-width="11"/>
    <path d="M 1630,860 L 1613,833 H 1647 Z" fill="#0000ff" stroke="#000000" stroke-width="2"/>

    <!-- PRF supplies COMMIT; ROB head supplies ready/order control. -->
    <path d="M 1785,945 H 1812 V 470 H 1820" fill="none" stroke="#000000" stroke-width="17" stroke-linejoin="round"/>
    <path d="M 1785,945 H 1812 V 470 H 1820" fill="none" stroke="#0000ff" stroke-width="11" stroke-linejoin="round"/>
    <path d="M 1840,470 L 1814,453 V 487 Z" fill="#0000ff" stroke="#000000" stroke-width="2"/>
    <path d="M 1915,860 V 712" fill="none" stroke="#ff0000" stroke-width="3"/>
    <path d="M 1915,690 L 1905,712 H 1925 Z" fill="#ff0000"/>

    <!-- COMMIT authorizes SD; writing stays inside mem_ctrl. -->
    <path d="M 2040,690 V 815 H 1528 V 620 H 1520" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    <path d="M 2040,690 V 815 H 1528 V 620 H 1520" fill="none" stroke="#ff0000" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 1510,620 L 1527,610 V 630 Z" fill="#ff0000"/>
    <rect x="1828" y="799" width="65" height="31" fill="#ccecff"/>
    <text text-anchor="middle" font-family="Arial" x="1860" y="822" font-size="23" fill="#c00000">strt</text>

    <!-- Only committed values update ARF. -->
    <path d="M 2130,470 H 2150 V 1058 H 477 V 1048" fill="none" stroke="#000000" stroke-width="14" stroke-linejoin="round"/>
    <path d="M 2130,470 H 2150 V 1058 H 477 V 1048" fill="none" stroke="#b7dde8" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 477,1035 L 463,1057 H 491 Z" fill="#b7dde8" stroke="#000000" stroke-width="2"/>
    <rect x="1162" y="1045" width="150" height="28" fill="#ccecff"/>
    <text text-anchor="middle" font-family="Arial" x="1237" y="1066" font-size="19">COMMIT → ARF</text>

    <!-- Compact legend and source identity; no personal metadata. -->
    <g font-size="20" text-anchor="start">
      <path d="M 350,1115 H 401 V 1107 L 419,1119 L 401,1131 V 1123 H 350 Z" fill="#0000ff" stroke="#000000" stroke-width="2"/>
      <text text-anchor="start" font-family="Arial" x="433" y="1125">명령·결과</text>
      <path d="M 700,1115 H 751 V 1107 L 769,1119 L 751,1131 V 1123 H 700 Z" fill="#b7dde8" stroke="#000000" stroke-width="2"/>
      <text text-anchor="start" font-family="Arial" x="783" y="1125">되먹임 / CDB</text>
      <path d="M 1110,1119 H 1165" stroke="#ff0000" stroke-width="3"/>
      <path d="M 1178,1119 L 1162,1110 V 1128 Z" fill="#ff0000"/>
      <text text-anchor="start" font-family="Arial" x="1192" y="1125">제어 / 복구 (1–5: 호출 순서)</text>
    </g>
    <text font-family="Arial" x="2130" y="1125" font-size="19" text-anchor="end">arch.py @ 7831647 · 기본 설정</text>
  </g>
</svg>
